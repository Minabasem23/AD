<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDKs -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.wallet{
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 20px;
  width: 360px;
  text-align:center;
}
button{
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  background: #ffd700;
  color:#222;
}
button:disabled{
  background:#999;
  cursor:not-allowed;
}
input{
  width: 100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:12px;
  border:none;
}
.status{
  margin:5px 0;
  min-height: 20px;
}
</style>
</head>

<body>
<div class="wallet">
  <h2>Mini MO Wallet</h2>
  <p>Watched Ads: <span id="ads">0</span></p>

  <hr>
  <button id="ad1Btn">Watch Ad 1</button>
  <div class="status" id="ad1Status"></div>

  <button id="ad2Btn">Watch Ad 2</button>
  <div class="status" id="ad2Status"></div>

  <hr>
  <input type="text" id="promo" placeholder="Enter Promo Code">
  <button id="applyPromo">Apply Promo</button>
  <div class="status" id="promoStatus"></div>
</div>

<script>
// ===== LocalStorage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
  adsWatched:0,
  promoUsed:false
};
let adsWatched = wallet.adsWatched || 0;
document.getElementById("ads").textContent = adsWatched;

// ===== Smartlink URLs =====
const smartlinks = [
  "https://omg10.com/4/10591369",
  "https://omg10.com/4/10725699"
];

// ===== Ads Functions =====
async function watchAd(adBtn, adSDK, statusDiv, smartlink){
  if(typeof adSDK !== "function"){
    statusDiv.textContent = "Ad not loaded";
    return;
  }

  adBtn.disabled = true;
  statusDiv.textContent = "⏳ Watching ad 15s...";

  const start = Date.now();
  try{
    await adSDK({ ymid:"user_test" });
  }catch{
    statusDiv.textContent = "❌ No ad available";
    adBtn.disabled = false;
    return;
  }

  // check 15s
  const elapsed = Date.now() - start;
  if(elapsed < 15000){
    statusDiv.textContent = "❌ You did not watch all ads";
    adBtn.disabled = false;
    return;
  }

  adsWatched++;
  wallet.adsWatched = adsWatched;
  localStorage.setItem("wallet", JSON.stringify(wallet));

  document.getElementById("ads").textContent = adsWatched;
  statusDiv.textContent = "✅ Ad Completed! Redirecting...";

  // open smartlink
  setTimeout(()=>window.open(smartlink,"_blank"),500);
  adBtn.disabled = false;
}

// ===== Buttons =====
document.getElementById("ad1Btn").onclick = ()=>{
  watchAd(
    document.getElementById("ad1Btn"),
    show_10638478,
    document.getElementById("ad1Status"),
    smartlinks[0]
  );
};
document.getElementById("ad2Btn").onclick = ()=>{
  watchAd(
    document.getElementById("ad2Btn"),
    show_10743949,
    document.getElementById("ad2Status"),
    smartlinks[1]
  );
};

// ===== Promo Code =====
document.getElementById("applyPromo").onclick = ()=>{
  const code = document.getElementById("promo").value.trim().toUpperCase();
  const promoStatus = document.getElementById("promoStatus");
  if(wallet.promoUsed){
    promoStatus.textContent = "❌ Promo already used";
    return;
  }
  if(code==="MINANL"){
    promoStatus.textContent = "✅ Promo Applied: no ads limit";
    wallet.promoUsed = true;
  }else if(code==="MINAYL"){
    promoStatus.textContent = "✅ Promo Applied";
    wallet.promoUsed = true;
  }else if(code==="ADS100"){
    adsWatched += 10;
    wallet.adsWatched = adsWatched;
    document.getElementById("ads").textContent = adsWatched;
    promoStatus.textContent = "✅ 10 Ads Added!";
    wallet.promoUsed = true;
  }else{
    promoStatus.textContent = "❌ Invalid Promo";
    return;
  }
  localStorage.setItem("wallet",JSON.stringify(wallet));
};
</script>
</body>
</html>
