<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDKs -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.wallet {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 20px;
  width: 360px;
  text-align: center;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #999;
}
#progressBar {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  margin-bottom: 10px;
  overflow: hidden;
}
#progress {
  height: 100%;
  width: 0%;
  background: #00ff88;
}
#status {
  margin-top: 10px;
  min-height: 20px;
}
</style>
</head>
<body>

<div class="wallet">
  <h2>Mini MO Wallet</h2>

  <p>Ads watched: <span id="ads">0</span></p>

  <div id="progressBar"><div id="progress"></div></div>

  <button id="btn1">Watch Ad 1</button>
  <button id="btn2">Watch Ad 2</button>

  <p id="status"></p>
</div>

<script>
let adsWatched = 0;
let isWatching = false;

const status = document.getElementById("status");
const progress = document.getElementById("progress");

// Smartlinks
const links = [
  "https://omg10.com/4/10591369",
  "https://omg10.com/4/10725699"
];

// ===== دالة مشاهدة الإعلان =====
function watchAd(sdkFunc, link){

  if(isWatching){
    status.innerText = "⚠️ Wait until current ad finishes";
    return;
  }

  if(typeof sdkFunc !== "function"){
    status.innerText = "❌ Ad not loaded";
    return;
  }

  isWatching = true;
  status.innerText = "⏳ Watching ad...";
  progress.style.width = "0%";

  let completed = false;
  let seconds = 0;

  // تشغيل SDK
  sdkFunc({ ymid:"user_test" }).catch(()=>{});

  // عداد 14 ثانية
  const timer = setInterval(()=>{
    seconds++;

    progress.style.width = `${(seconds/14)*100}%`;
    status.innerText = `⏳ ${14 - seconds}s`;

    // بعد 14 ثانية
    if(seconds >= 14){
      completed = true;
      clearInterval(timer);

      window.open(link, "_blank"); // فتح Smartlink

      adsWatched++;
      document.getElementById("ads").textContent = adsWatched;

      status.innerText = "✅ Ad completed";
      progress.style.width = "0%";
      isWatching = false;
    }

  },1000);

  // كشف الغش (لو المستخدم خرج ورجع)
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden && !completed){
      clearInterval(timer);
      status.innerText = "❌ You did not watch full ad";
      progress.style.width = "0%";
      isWatching = false;
    }
  }, { once:true });

}

// ربط الأزرار
document.getElementById("btn1").onclick = ()=> watchAd(show_10638478, links[0]);
document.getElementById("btn2").onclick = ()=> watchAd(show_10743949, links[1]);

</script>

</body>
</html>
