<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag -->
<script src="//libtl.com/sdk.js"
data-zone="10638478"
data-sdk="show_10638478"></script>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.wallet{
background:rgba(0,0,0,0.4);
padding:30px;
border-radius:20px;
width:340px;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ffd700;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

.timer{
margin-top:10px;
font-size:14px;
}
</style>
</head>

<body>

<div class="wallet">

<h2>Mini MO Wallet</h2>

<p>Balance: <span id="balance">0</span> MO</p>
<p>Ads watched: <span id="ads">0</span></p>

<button id="watchAd">Watch Ad</button>
<p class="timer" id="timer"></p>

</div>

<script>

// ===== wallet =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
balance:0,
ads:0
}

let balance = wallet.balance
let ads = wallet.ads

const btn = document.getElementById("watchAd")
const timerText = document.getElementById("timer")

function updateUI(){

document.getElementById("balance").textContent = balance
document.getElementById("ads").textContent = ads

localStorage.setItem("wallet",JSON.stringify({
balance:balance,
ads:ads
}))

}

updateUI()

// ===== سؤال ضد الغش =====
function antiBotQuestion(){

let a = Math.floor(Math.random()*10)+1
let b = Math.floor(Math.random()*10)+1

let answer = prompt(`Solve to continue: ${a} + ${b}`)

if(parseInt(answer) !== a+b){
alert("Wrong answer")
return false
}

return true

}

// ===== مشاهدة إعلان =====
btn.onclick = async ()=>{

if(typeof show_10638478 !== "function"){
alert("Ad not loaded")
return
}

// كل 50 إعلان يظهر سؤال
if(ads > 0 && ads % 50 === 0){

if(!antiBotQuestion()){
return
}

}

try{

await show_10638478({ ymid:"user_test" })

btn.disabled = true

let time = 15

timerText.innerText = "Please wait "+time+"s"

let interval = setInterval(()=>{

time--

timerText.innerText = "Please wait "+time+"s"

if(time <= 0){

clearInterval(interval)

balance += 1
ads += 1

updateUI()

timerText.innerText = "Reward added!"

btn.disabled = false

}

},1000)

}catch{

alert("No ads available")

}

}

</script>

</body>
</html>
