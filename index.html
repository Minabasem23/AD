<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js"
        data-zone="10638478"
        data-sdk="show_10638478"></script>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.wallet{
background:rgba(0,0,0,0.4);
padding:30px;
border-radius:20px;
width:340px;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ffd700;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffee55;
}

</style>
</head>

<body>

<div class="wallet">

<h2>Mini MO Wallet</h2>

<p>Balance: <span id="balance">0</span> MO</p>
<p>Ads watched: <span id="ads">0</span> / 250</p>

<button id="watchAd">Watch Ad</button>

</div>

<script>

// ===== wallet storage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
balance:0,
ads:0
}

let balance = wallet.balance
let ads = wallet.ads

updateUI()

function updateUI(){

document.getElementById("balance").textContent = balance
document.getElementById("ads").textContent = ads

localStorage.setItem("wallet",JSON.stringify({
balance:balance,
ads:ads
}))

}

// ===== watch ad =====
document.getElementById("watchAd").onclick = async ()=>{

if(ads >= 250){
alert("Daily limit reached (250 ads)")
return
}

if(typeof show_10638478 !== "function"){
alert("Ad SDK not loaded")
return
}

try{

await show_10638478({ ymid:"user_test" })

balance += 1
ads += 1

updateUI()

alert("You earned 1 MO")

}catch{

alert("No ads available")

}

}

</script>

</body>
</html>
