<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAI Miner</title>

<script src="//libtl.com/sdk.js"
data-zone="10638478"
data-sdk="show_10638478"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background: radial-gradient(circle,#1e3a8a,#0f172a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:360px;
    background:rgba(17,24,39,0.95);
    border-radius:25px;
    padding:25px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
}

.title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
    color:#facc15;
}

.balance{
    font-size:26px;
    margin:10px 0;
}

.chargeText{
    font-size:14px;
    opacity:0.8;
}

.bar{
    width:100%;
    height:16px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#22c55e,#4ade80);
    transition:0.2s;
}

.coin{
    width:180px;
    height:180px;
    margin:25px auto;
    cursor:pointer;
}

.coin img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
    filter:drop-shadow(0 0 20px gold);
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#2563eb,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    outline:none;          /* إزالة الـ outline عند الضغط */
    -webkit-tap-highlight-color: transparent; /* إزالة الـ highlight على الموبايل */
}

button:focus{
    outline:none;          /* إزالة الـ outline عند التركيز */
}

button:active{
    outline:none;
}

#msg{
    margin-top:15px;
    min-height:20px;
    color:#facc15;
}

.note{
    margin-top:15px;
    font-size:12px;
    opacity:0.7;
    line-height:1.4;
}

</style>
</head>

<body>

<div class="box">

<div class="title">⛏ AAI Miner</div>

<div class="balance" id="balance">0 AAI</div>

<div class="chargeText">
⚡ Charge: <span id="chargeText">200 / 200</span>
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="coin" id="coin">
<img src="coin.png">
</div>

<button id="adBtn">⚡ Charge</button>

<div id="msg"></div>

<div class="note">
⚠ All AAI is saved on your device. Do not delete the app or clear data.
</div>

</div>

<script>

const MAX_CHARGE = 200;

// ===== Encrypt =====
function encrypt(d){
    return btoa(JSON.stringify(d));
}

function decrypt(d){
    try{
        return JSON.parse(atob(d));
    }catch{
        return null;
    }
}

// ===== Load =====
let save = decrypt(localStorage.getItem("AAI_SAVE")) || {
    balance:0,
    charge:MAX_CHARGE
};

// ===== Elements =====
const balanceEl = document.getElementById("balance");
const chargeText = document.getElementById("chargeText");
const fill = document.getElementById("fill");
const coin = document.getElementById("coin");
const adBtn = document.getElementById("adBtn");
const msg = document.getElementById("msg");

// ===== Update UI =====
function updateUI(){

    balanceEl.innerText = save.balance + " AAI";
    chargeText.innerText = save.charge + " / " + MAX_CHARGE;

    fill.style.width =
    (save.charge / MAX_CHARGE * 100) + "%";

    localStorage.setItem("AAI_SAVE", encrypt(save));
}

updateUI();

// ===== Mining =====
coin.onclick = ()=>{

    if(save.charge <= 0){
        msg.innerText = "⚠ Charge empty";
        return;
    }

    save.balance += 1;
    save.charge -= 1;

    updateUI();
};

// ===== Charge with Ad =====
adBtn.onclick = async ()=>{

    if(typeof show_10638478 !== "function"){
        msg.innerText = "❌ Ad not loaded";
        return;
    }

    msg.innerText = "⏳ Loading ad...";

    try{

        await show_10638478({ymid:"user_test"});

        save.charge = MAX_CHARGE;

        updateUI();

        msg.innerText = "✅ Charge restored";

    }catch{

        msg.innerText = "❌ No ads available";
    }
};

</script>

</body>
</html>
