<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDK 1 -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<!-- Monetag SDK 2 -->
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body { font-family: Arial; background: linear-gradient(135deg,#6a11cb,#2575fc); color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.wallet { background: rgba(0,0,0,0.4); padding:30px; border-radius:20px; width:340px; text-align:center; }
button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:10px; background:#ffd700; font-weight:bold; cursor:pointer; }
button:disabled { background:#999; }
</style>
</head>
<body>

<div class="wallet">
  <h2>Mini MO Wallet</h2>
  <p>Balance: <span id="balance">0</span> MO</p>
  <p>Ads watched 1: <span id="ads1">0</span></p>
  <p>Ads watched 2: <span id="ads2">0</span></p>

  <button id="watchAd1">Watch Ad 1</button>
  <button id="watchAd2">Watch Ad 2</button>
</div>

<script>
const MAX_ADS = 100;
const REWARD = 1; // لكل إعلان
const WAIT_TIME = 15000; // 15 ثانية

// ===== LocalStorage
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
  balance:0, ads1:0, ads2:0
};

let balance = wallet.balance;
let ads1 = wallet.ads1;
let ads2 = wallet.ads2;

function updateUI() {
  document.getElementById("balance").textContent = balance;
  document.getElementById("ads1").textContent = ads1;
  document.getElementById("ads2").textContent = ads2;
  localStorage.setItem("wallet", JSON.stringify({balance, ads1, ads2}));
}
updateUI();

// ===== Ad Buttons =====
document.getElementById("watchAd1").onclick = async ()=>{
  if(ads1 >= MAX_ADS){
    alert("🚫 Ad 1 limit reached");
    return;
  }
  await watchAd("show_10638478", "ads1");
}

document.getElementById("watchAd2").onclick = async ()=>{
  if(ads2 >= MAX_ADS){
    alert("🚫 Ad 2 limit reached");
    return;
  }
  await watchAd("show_10743949", "ads2");
}

// ===== Watch Ad Function
async function watchAd(sdkFuncName, adKey){
  const sdkFunc = window[sdkFuncName];
  if(typeof sdkFunc !== "function"){
    alert("Ad SDK not loaded");
    return;
  }

  const start = Date.now();
  try{
    await sdkFunc({ ymid:"user_test" });
    const timeWatched = Date.now() - start;
    if(timeWatched < WAIT_TIME){
      alert("❌ You must watch at least 15 seconds");
      return;
    }

    // تحديث الرصيد
    balance += REWARD;
    wallet[adKey] += 1;
    if(adKey==="ads1") ads1++;
    else ads2++;

    updateUI();

    // فتح SmartLink بعد الإعلان
    const links = [
      "https://omg10.com/4/10591369",
      "https://omg10.com/4/10725699",
      "https://omg10.com/4/10591326",
      "https://omg10.com/4/10746516"
    ];
    const randomLink = links[Math.floor(Math.random()*links.length)];
    window.open(randomLink, "_blank");

  }catch{
    alert("❌ No ad available");
  }
}
</script>
</body>
</html>
