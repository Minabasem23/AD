<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 20px;
}
.wallet-container {
  background: rgba(0,0,0,0.35);
  padding: 25px;
  border-radius: 20px;
  width: 360px;
}
h1,h2{text-align:center;}
button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #ffd700;
  color: #222;
  font-weight: bold;
}
button:hover { background: #ffec50; }
.hidden { display: none; }
</style>
</head>

<body>
<div class="wallet-container">
  <h2>Mini MO Wallet</h2>

  <p>Balance: <b><span id="balance">0</span></b> MO</p>
  <p>Ads watched: <span id="ads">0</span></p>

  <button id="watchBtn">Watch Ad</button>
  <p id="status" class="hidden"></p>
</div>

<script>
// ===== إعداد LocalStorage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || { balance: 0, adsWatched: 0 };
let balance = wallet.balance;
let adsWatched = wallet.adsWatched;
document.getElementById("balance").textContent = balance;
document.getElementById("ads").textContent = adsWatched;

// ===== متغيرات النظام =====
const REWARD = 1;       // 1 MO لكل إعلان
const MAX_ADS = 50;     // الحد الأقصى 50 إعلان
const AD_TIME = 15000;  // 15 ثانية مؤقت

// ===== تحديث الواجهة =====
function updateUI() {
  document.getElementById("balance").textContent = balance;
  document.getElementById("ads").textContent = adsWatched;
  localStorage.setItem("wallet", JSON.stringify({ balance, adsWatched }));
}

// ===== مشاهدة إعلان =====
document.getElementById("watchBtn").onclick = async () => {
  if(adsWatched >= MAX_ADS){
    alert("✅ You reached the maximum ads per day (50)");
    return;
  }

  if(typeof show_10638478 !== "function"){
    alert("SDK not loaded");
    return;
  }

  const status = document.getElementById("status");
  status.textContent = "⏳ Watching ad...";
  status.classList.remove("hidden");

  const adStart = Date.now();
  try {
    await show_10638478({ ymid: "ad_dummy" });
  } catch {
    status.textContent = "❌ No ad available";
    setTimeout(()=>status.classList.add("hidden"),2000);
    return;
  }

  const watchedTime = Date.now() - adStart;
  if(watchedTime < AD_TIME){
    status.textContent = "❌ Your watch not completed";
    setTimeout(()=>status.classList.add("hidden"),2000);
    return;
  }

  balance += REWARD;
  adsWatched++;
  updateUI();

  status.textContent = `✅ +${REWARD} MO`;
  setTimeout(()=>status.classList.add("hidden"),2000);
};
</script>
</body>
</html>
