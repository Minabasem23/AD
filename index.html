<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDKs -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.wallet {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 20px;
  width: 360px;
  text-align: center;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { background: #999; }
#progressBar {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  margin-bottom: 5px;
  overflow: hidden;
}
#progress {
  height: 100%;
  width: 0%;
  background: #00ff88;
  transition: width 0.3s;
}
#status {
  margin-top: 10px;
  min-height: 20px;
}
</style>
</head>
<body>

<div class="wallet">
  <h2>Mini MO Wallet</h2>
  <p>Ads watched: <span id="ads">0</span></p>

  <div id="buttonsContainer"></div>
  <p id="status"></p>
</div>

<script>
// ===== الإعلانات مع SDK و direct links =====
const ads = [
  { sdk: show_10638478, link: "https://omg10.com/4/10591369" },
  { sdk: show_10743949, link: "https://omg10.com/4/10725699" },
  { sdk: show_10638478, link: "https://omg10.com/4/10591326" },
  { sdk: show_10743949, link: "https://omg10.com/4/10746516" }
];

// ===== LocalStorage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || { adsWatched: 0 };
let adsWatched = wallet.adsWatched;

const buttonsContainer = document.getElementById("buttonsContainer");
const status = document.getElementById("status");

// ===== تحديث UI =====
function updateUI(){
  document.getElementById("ads").textContent = adsWatched;
  localStorage.setItem("wallet", JSON.stringify({ adsWatched }));
}

// ===== إنشاء أزرار لكل إعلان =====
ads.forEach((ad, index) => {
  const progressBar = document.createElement("div");
  progressBar.id = "progressBar";
  const progress = document.createElement("div");
  progress.id = "progress";
  progressBar.appendChild(progress);

  const btn = document.createElement("button");
  btn.innerText = `Watch Ad ${index + 1}`;

  btn.onclick = async () => {
    btn.disabled = true;
    status.innerText = "⏳ Watching ad... 14s";

    // ✅ تشغيل SDK
    if(typeof ad.sdk !== "function"){
      alert("SDK not loaded");
      btn.disabled = false;
      return;
    }

    try{
      const startTime = Date.now();

      await ad.sdk({ ymid: "user_test" });

      // عداد 14 ثانية
      let elapsed14 = 0;
      const timer14 = setInterval(() => {
        elapsed14++;
        progress.style.width = `${(elapsed14/14)*100}%`;
        status.innerText = `⏳ Watching ad... ${14 - elapsed14}s`;

        if(elapsed14 >= 14){
          clearInterval(timer14);
          // فتح direct link بعد 14s
          window.open(ad.link, "_blank");
          // عداد 15 ثانية لمراقبة الغش
          let elapsed15 = 0;
          const timer15 = setInterval(()=>{
            elapsed15++;
            if(elapsed15 >= 15){
              clearInterval(timer15);
              adsWatched++;
              updateUI();
              status.innerText = `✅ Ad ${index + 1} completed`;
              btn.disabled = false;
            }
          },1000);
        }
      }, 1000);

    }catch{
      status.innerText = "❌ Ad failed or not available";
      btn.disabled = false;
    }
  };

  buttonsContainer.appendChild(progressBar);
  buttonsContainer.appendChild(btn);
});

// تحديث الـ UI أول مرة
updateUI();
</script>

</body>
</html>
