<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDK 1 -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>

<!-- Monetag SDK 2 -->
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.wallet {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 20px;
  width: 340px;
  text-align: center;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #999;
}
</style>
</head>

<body>

<div class="wallet">
  <h2>Mini MO Wallet</h2>

  <p>Balance: <span id="balance">0</span> MO</p>
  <p>Ads watched: <span id="ads">0</span></p>

  <button id="watchBtn">Watch Ad</button>
  <p id="status"></p>
</div>

<script>

// ===== Smartlinks =====
const smartLinks = [
  "https://omg10.com/4/10591369",
  "https://omg10.com/4/10725699",
  "https://omg10.com/4/10591326",
  "https://omg10.com/4/10746516"
];

// ===== storage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
  balance:0,
  ads:0,
  lastAd:1
};

let balance = wallet.balance;
let ads = wallet.ads;
let lastAd = wallet.lastAd;

const btn = document.getElementById("watchBtn");
const status = document.getElementById("status");

updateUI();

function updateUI(){
  document.getElementById("balance").textContent = balance;
  document.getElementById("ads").textContent = ads;

  localStorage.setItem("wallet",JSON.stringify({
    balance,
    ads,
    lastAd
  }));
}

// ===== watch ad =====
btn.onclick = async ()=>{

  let adFunction;

  // 🔁 تبديل الإعلانات
  if(lastAd === 1){
    adFunction = show_10638478;
    lastAd = 2;
  }else{
    adFunction = show_10743949;
    lastAd = 1;
  }

  if(typeof adFunction !== "function"){
    alert("Ad not loaded");
    return;
  }

  try{
    status.innerText = "⏳ Watching ad...";
    btn.disabled = true;

    const start = Date.now();

    await adFunction({ ymid:"user_test" });

    const time = Date.now() - start;

    if(time < 15000){
      status.innerText = "❌ Your watch not completed";
      btn.disabled = false;
      return;
    }

    // ✅ reward
    balance += 1;
    ads += 1;
    updateUI();

    status.innerText = "✅ +1 MO";

    // 🎯 اختيار Smartlink عشوائي
    const randomLink = smartLinks[Math.floor(Math.random() * smartLinks.length)];

    // 🚀 فتح الرابط بعد ثانية
    setTimeout(()=>{
      window.open(randomLink, "_blank");
    },1000);

    btn.disabled = false;

  }catch{
    status.innerText = "❌ No ad available";
    btn.disabled = false;
  }

};

</script>

</body>
</html>
