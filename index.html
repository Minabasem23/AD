<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAI Miner</title>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js"
data-zone="10638478"
data-sdk="show_10638478"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:340px;
    text-align:center;
    background:#111827;
    padding:25px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.coin{
    width:170px;
    height:170px;
    border-radius:50%;
    margin:20px auto;
    background:linear-gradient(145deg,#facc15,#eab308);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    transition:.1s;
}

.coin:active{
    transform:scale(0.95);
}

.bar{
    width:100%;
    height:18px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:100%;
    width:100%;
    background:#22c55e;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:15px;
    font-weight:bold;
    cursor:pointer;
    background:#3b82f6;
    color:white;
}

#msg{
    margin-top:15px;
    min-height:20px;
}
</style>
</head>
<body>

<div class="box">

<h2>⛏ AAI Miner</h2>

<h3 id="balance">0 AAI</h3>

<p>
⚡ Charge:
<span id="chargeText">200 / 200</span>
</p>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<p>
🔋 AUTO CHARGE:
<span>1 / 3S</span>
</p>

<div class="coin" id="coin">
AAI
</div>

<button id="adBtn" style="display:none;">
View ad by Monetag
</button>

<p id="msg"></p>

</div>

<script>

// ===== الإعداد =====
const MAX_CHARGE = 200;

// ===== تشفير =====
function encrypt(data){
    return btoa(JSON.stringify(data));
}

function decrypt(data){
    try{
        return JSON.parse(atob(data));
    }catch{
        return null;
    }
}

// ===== تحميل البيانات =====
let save = decrypt(localStorage.getItem("AAI_SAVE")) || {
    balance:0,
    charge:MAX_CHARGE
};

// ===== العناصر =====
const balanceEl = document.getElementById("balance");
const chargeText = document.getElementById("chargeText");
const fill = document.getElementById("fill");
const coin = document.getElementById("coin");
const adBtn = document.getElementById("adBtn");
const msg = document.getElementById("msg");

// ===== تحديث الواجهة =====
function updateUI(){

    balanceEl.innerText =
    save.balance + " AAI";

    chargeText.innerText =
    save.charge + " / " + MAX_CHARGE;

    fill.style.width =
    (save.charge / MAX_CHARGE * 100) + "%";

    localStorage.setItem(
        "AAI_SAVE",
        encrypt(save)
    );

    // إظهار زر الإعلان فقط إذا الشحن انتهى
    if(save.charge <= 0){

        adBtn.style.display = "block";
        coin.style.opacity = "0.5";

    }else{

        adBtn.style.display = "none";
        coin.style.opacity = "1";
    }
}

updateUI();

// ===== الضغط على العملة =====
coin.onclick = ()=>{

    if(save.charge <= 0){

        msg.innerText =
        "⚠ Charge empty";

        return;
    }

    save.balance += 1;
    save.charge -= 1;

    updateUI();
};

// ===== إعلان Monetag =====
adBtn.onclick = async ()=>{

    if(typeof show_10638478 !== "function"){

        msg.innerText =
        "❌ Ad not loaded";

        return;
    }

    msg.innerText =
    "⏳ Loading ad...";

    try{

        await show_10638478({
            ymid:"user_test"
        });

        save.charge = MAX_CHARGE;

        updateUI();

        msg.innerText =
        "✅ Charge restored";

    }catch{

        msg.innerText =
        "❌ No ads available";
    }

};

// ===== AUTO CHARGE =====
// كل 3 ثواني +1 charge
setInterval(()=>{

    if(save.charge < MAX_CHARGE){

        save.charge += 1;

        updateUI();
    }

},3000);

</script>

</body>
</html>
