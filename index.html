<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Wallet with Ads & Promo</title>

<!-- Monetag SDK 1 -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<!-- Monetag SDK 2 -->
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 20px;
}

.wallet {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 20px;
  width: 360px;
  text-align: center;
}

h2 { margin-bottom: 15px; }

.balance, .ads { margin: 10px 0; }

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { background: #999; cursor: not-allowed; }

.progress-container {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  margin: 5px 0 15px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #00ff88;
  transition: width 0.1s linear;
}

#promoContainer { margin-top: 20px; }
</style>
</head>
<body>

<div class="wallet">
  <h2>Mini Wallet</h2>
  <p class="balance">Balance: <span id="balance">0</span></p>
  <p class="ads">Ads watched: <span id="ads">0</span></p>

  <div>
    <button id="adBtn1">Watch Ad 1</button>
    <div class="progress-container"><div id="progress1" class="progress-bar"></div></div>
  </div>

  <div>
    <button id="adBtn2">Watch Ad 2</button>
    <div class="progress-container"><div id="progress2" class="progress-bar"></div></div>
  </div>

  <div id="promoContainer">
    <input type="text" id="promoCode" placeholder="Enter Promo Code" />
    <button id="applyPromo">Apply Promo</button>
  </div>
</div>

<script>
const REWARD = 1;
const WAIT_TIME = 15000; // 15s
const links = [
  "https://omg10.com/4/10591369",
  "https://omg10.com/4/10725699",
  "https://omg10.com/4/10591326",
  "https://omg10.com/4/10746516"
];

// ===== Storage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || { balance: 0, ads: 0, usedPromo: false };
let balance = wallet.balance;
let ads = wallet.ads;
let usedPromo = wallet.usedPromo;

// ===== Update UI =====
function updateUI(){
  document.getElementById("balance").textContent = balance;
  document.getElementById("ads").textContent = ads;
  localStorage.setItem("wallet", JSON.stringify({ balance, ads, usedPromo }));
}

// ===== Watch Ad Function =====
async function watchAd(sdkFuncName, progressBarId){
  const btn = document.getElementById("adBtn" + progressBarId);
  const progressBar = document.getElementById("progress" + progressBarId);

  if(typeof window[sdkFuncName] !== "function"){
    alert("🚫 Ad SDK not loaded yet");
    return;
  }

  btn.disabled = true;
  const start = Date.now();

  let interval = setInterval(()=>{
    const elapsed = Date.now() - start;
    let percent = Math.min(100, (elapsed / WAIT_TIME) * 100);
    progressBar.style.width = percent + "%";
  }, 50);

  try {
    await window[sdkFuncName]({ ymid: "user_test" });
    const timeWatched = Date.now() - start;

    clearInterval(interval);
    progressBar.style.width = "0%";

    if(timeWatched < WAIT_TIME){
      alert("❌ You must watch the ad for 15 seconds");
      btn.disabled = false;
      return;
    }

    // ✅ Add reward
    balance += REWARD;
    ads += 1;
    updateUI();

    // Open SmartLink
    const randomLink = links[Math.floor(Math.random()*links.length)];
    window.open(randomLink, "_blank");

    alert(`✅ +${REWARD} Ads count`);

  } catch {
    clearInterval(interval);
    progressBar.style.width="0%";
    alert("❌ No ad available");
  } finally {
    btn.disabled = false;
  }
}

// ===== Buttons =====
document.getElementById("adBtn1").onclick = () => watchAd('show_10638478', 1);
document.getElementById("adBtn2").onclick = () => watchAd('show_10743949', 2);

// ===== Promo Code =====
document.getElementById("applyPromo").onclick = ()=>{
  const code = document.getElementById("promoCode").value.trim().toUpperCase();

  if(!code) { alert("❌ Enter a promo code"); return; }
  if(usedPromo){ alert("❌ Promo code already used"); return; }

  if(code === "MINANL"){
    ads = 0; // remove all ads
    alert("✅ Promo Applied: Ads reset to 0");
  } else if(code === "MINAYL"){
    ads += 1;
    alert("✅ Promo Applied: +1 Ad");
  } else if(code === "ADS100"){
    ads += 10;
    alert("✅ Promo Applied: +10 Ads");
  } else {
    alert("❌ Invalid promo code");
    return;
  }

  usedPromo = true;
  updateUI();
};
updateUI();
</script>
</body>
</html>
