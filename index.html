<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Wallet Ads + Promo</title>

<!-- Monetag SDK 1 -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<!-- Monetag SDK 2 -->
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body { font-family: Arial; background: linear-gradient(135deg,#6a11cb,#2575fc); color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.wallet { background: rgba(0,0,0,0.4); padding:30px; border-radius:20px; width:360px; text-align:center; }
button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:10px; background:#ffd700; font-weight:bold; cursor:pointer; }
button:disabled { background:#999; }
.progress { width:100%; height:5px; background:#222; border-radius:5px; margin-bottom:5px; overflow:hidden; }
.progress-bar { height:100%; width:0%; background:#00ff88; transition: width 0.1s; }
input { width:100%; padding:8px; margin:10px 0; border-radius:8px; border:none; }
</style>
</head>
<body>

<div class="wallet">
  <h2>Mini Wallet</h2>

  <p>Balance: <span id="balance">0</span></p>
  <p>Ads watched 1: <span id="ads1">0</span></p>
  <p>Ads watched 2: <span id="ads2">0</span></p>

  <input type="text" id="promoCode" placeholder="Enter Promo Code">
  <button id="applyPromo">Apply Promo</button>

  <div class="progress"><div id="progress1" class="progress-bar"></div></div>
  <button id="watchAd1">Watch Ad 1</button>

  <div class="progress"><div id="progress2" class="progress-bar"></div></div>
  <button id="watchAd2">Watch Ad 2</button>
</div>

<script>
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
  balance:0, ads1:0, ads2:0, maxAds:100
};

let balance = wallet.balance;
let ads1 = wallet.ads1;
let ads2 = wallet.ads2;
let maxAds = wallet.maxAds;

function updateUI(){
  document.getElementById("balance").textContent = balance;
  document.getElementById("ads1").textContent = ads1;
  document.getElementById("ads2").textContent = ads2;
  localStorage.setItem("wallet", JSON.stringify({balance, ads1, ads2, maxAds}));
}
updateUI();

// ===== Promo Code =====
document.getElementById("applyPromo").onclick = ()=>{
  const code = document.getElementById("promoCode").value.trim().toUpperCase();
  if(code==="MINANL"){ maxAds = Infinity; alert("✅ No ads limit"); }
  else if(code==="MINAYL"){ maxAds = 100; alert("✅ Normal ads limit"); }
  else if(code==="ADS100"){ ads1 += 10; ads2 += 10; alert("✅ Added 10 ads each"); }
  else { alert("❌ Invalid promo code"); }
  updateUI();
}

// ===== Ad Function =====
const REWARD = 1;
const WAIT_TIME = 15000;
const links = [
  "https://omg10.com/4/10591369",
  "https://omg10.com/4/10725699",
  "https://omg10.com/4/10591326",
  "https://omg10.com/4/10746516"
];

async function watchAd(sdkFuncName, adKey, progressBar){
  const sdkFunc = window[sdkFuncName];
  if(typeof sdkFunc !== "function"){ alert("Ad SDK not loaded"); return; }

  if(wallet[adKey] >= maxAds){ alert("🚫 Max ads reached"); return; }

  const btn = document.getElementById("watch"+adKey);
  btn.disabled = true;

  let startTime = Date.now();
  let interval = setInterval(()=>{
    let elapsed = Date.now()-startTime;
    let percent = Math.min(100, (elapsed/WAIT_TIME)*100);
    progressBar.style.width = percent+"%";
  },50);

  try{
    await sdkFunc({ ymid:"user_test" });

    clearInterval(interval);
    progressBar.style.width = "0%";
    const timeWatched = Date.now() - startTime;
    if(timeWatched < WAIT_TIME){ alert("❌ Watch at least 15s"); btn.disabled=false; return; }

    balance += REWARD;
    wallet[adKey] += 1;
    if(adKey==="ads1") ads1++; else ads2++;
    updateUI();

    const randomLink = links[Math.floor(Math.random()*links.length)];
    window.open(randomLink,"_blank");
    btn.disabled=false;
  }catch{
    clearInterval(interval);
    progressBar.style.width="0%";
    alert("❌ No ad available"); btn.disabled=false;
  }
}

// ===== Buttons =====
document.getElementById("watchAd1").onclick = ()=>{
  watchAd("show_10638478","ads1",document.getElementById("progress1"));
}
document.getElementById("watchAd2").onclick = ()=>{
  watchAd("show_10743949","ads2",document.getElementById("progress2"));
}
</script>

</body>
</html>
