<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads System</title>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: rgba(0,0,0,0.4);
  padding: 25px;
  border-radius: 20px;
  width: 360px;
  text-align: center;
}
button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #888;
}
.progressBar {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  overflow: hidden;
}
.progress {
  height: 100%;
  width: 0%;
  background: #00ff88;
}
#status {
  margin-top: 10px;
  min-height: 20px;
}
</style>
</head>

<body>

<div class="box">
<h3>Ads System</h3>

<!-- زر 1 -->
<div class="progressBar"><div id="prog1" class="progress"></div></div>
<button id="btn1">Watch Ad 1</button>

<!-- زر 2 -->
<div class="progressBar"><div id="prog2" class="progress"></div></div>
<button id="btn2">Watch Ad 2</button>

<p id="status"></p>
</div>

<script>

// ===== الإعداد =====
const MAX_ADS = 100;
const SMART_LINK = "https://omg10.com/4/10746516";

let data = JSON.parse(localStorage.getItem("adsData")) || {
  ad1: 0,
  ad2: 0
};

let isWatching = false;

const status = document.getElementById("status");

// ===== تحديث UI =====
function updateUI(){
  document.getElementById("prog1").style.width = (data.ad1/MAX_ADS*100)+"%";
  document.getElementById("prog2").style.width = (data.ad2/MAX_ADS*100)+"%";

  localStorage.setItem("adsData", JSON.stringify(data));
}
updateUI();

// ===== تشغيل الإعلان =====
function runAd(sdk, key){

  if(isWatching){
    status.innerText = "⚠️ انتظر انتهاء الإعلان";
    return;
  }

  if(data[key] >= MAX_ADS){
    status.innerText = "❌ وصلت للحد 100";
    return;
  }

  if(typeof sdk !== "function"){
    status.innerText = "❌ SDK لم يعمل";
    return;
  }

  isWatching = true;
  status.innerText = "⏳ جاري مشاهدة الإعلان...";

  let finished = false;
  let linkOpened = false;

  const startTime = Date.now();

  // 🔥 فتح نافذة فاضية (حل popup blocker)
  let adWindow = window.open("", "_blank");

  // تشغيل SDK
  sdk({ymid:"user_test"}).catch(()=>{});

  const timer = setInterval(()=>{

    let elapsed = Date.now() - startTime;
    let remain = Math.max(0, 15000 - elapsed);

    status.innerText = `⏳ ${Math.ceil(remain/1000)}s`;

    // 🔥 فتح اللينك عند 14 ثانية (بشكل مضمون)
    if(elapsed >= 14000 && !linkOpened){
      linkOpened = true;

      if(adWindow){
        adWindow.location.href = SMART_LINK;
      }
    }

    // ✅ احتساب عند 15 ثانية
    if(elapsed >= 15000){
      finished = true;
      clearInterval(timer);

      data[key]++;
      updateUI();

      status.innerText = "✅ تم احتساب الإعلان";
      isWatching = false;
    }

  },200);

  // ❌ منع الغش
  const visHandler = ()=>{
    if(document.hidden && !finished){
      clearInterval(timer);
      status.innerText = "❌ لم تكمل مشاهدة الإعلان";
      isWatching = false;
    }
  };

  document.addEventListener("visibilitychange", visHandler, { once:true });

}

// ===== الأزرار =====
document.getElementById("btn1").onclick = ()=>{
  runAd(show_10638478, "ad1");
};

document.getElementById("btn2").onclick = ()=>{
  runAd(show_10743949, "ad2");
};

</script>

</body>
</html>
