<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MO Wallet</title>

<!-- Monetag SDKs -->
<script src="//libtl.com/sdk.js" data-zone="10638478" data-sdk="show_10638478"></script>
<script src="//libtl.com/sdk.js" data-zone="10743949" data-sdk="show_10743949"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.wallet {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 20px;
  width: 360px;
  text-align: center;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #999;
}
#progressBar {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  margin-bottom: 10px;
  overflow: hidden;
}
#progress {
  height: 100%;
  width: 0%;
  background: #00ff88;
  transition: width 0.3s;
}
#status {
  margin-top: 10px;
  min-height: 20px;
}
</style>
</head>
<body>

<div class="wallet">
  <h2>Mini MO Wallet</h2>

  <p>Balance: <span id="balance">0</span> MO</p>
  <p>Ads watched: <span id="ads">0</span></p>

  <div id="progressBar"><div id="progress"></div></div>
  <button id="watchBtn">Watch Ad</button>
  <p id="status"></p>
</div>

<script>
// ===== Storage =====
let wallet = JSON.parse(localStorage.getItem("wallet")) || {
  balance: 0,
  ads: 0,
  lastAdIndex: 0
};
let balance = wallet.balance;
let ads = wallet.ads;
let lastAdIndex = wallet.lastAdIndex;

// Smartlinks بالتسلسل
const smartlinks = [
  "https://omg10.com/4/10591369",
  "https://omg10.com/4/10725699",
  "https://omg10.com/4/10591326",
  "https://omg10.com/4/10746516"
];

// Monetag SDKs بالتناوب
const adFunctions = [show_10638478, show_10743949];

const btn = document.getElementById("watchBtn");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

// ===== تحديث UI =====
function updateUI(){
  document.getElementById("balance").textContent = balance;
  document.getElementById("ads").textContent = ads;
  progress.style.width = `${(ads / smartlinks.length) * 100}%`;
  localStorage.setItem("wallet", JSON.stringify({balance, ads, lastAdIndex}));
}
updateUI();

// ===== مشاهدة إعلان بالتسلسل =====
btn.onclick = async ()=>{
  if(lastAdIndex >= smartlinks.length){
    status.innerText = "✅ All ads watched";
    return;
  }

  const adFunc = adFunctions[lastAdIndex % adFunctions.length];
  if(typeof adFunc !== "function"){
    status.innerText = "❌ Ad not loaded";
    return;
  }

  status.innerText = "⏳ Watching ad...";
  btn.disabled = true;

  const startTime = Date.now();
  try{
    await adFunc({ ymid: "user_test" });

    const elapsed = Date.now() - startTime;
    if(elapsed < 14000){
      status.innerText = "❌ You did not watch full ad";
      btn.disabled = false;
      return;
    }

    // بعد 14 ثانية افتح smartlink
    window.open(smartlinks[lastAdIndex], "_blank");

    // ✅ زيادة الرصيد والإعلانات
    balance += 1;
    ads += 1;
    lastAdIndex++;

    updateUI();
    status.innerText = `✅ +1 MO | Opened smartlink`;

    btn.disabled = false;

  }catch(e){
    console.log(e);
    status.innerText = "❌ No ad available";
    btn.disabled = false;
  }
};
</script>

</body>
</html>
